<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <style>
            body{
                display: flex;
                justify-content: center;
            }
            .container{
                position: relative;
                width:250px ;
                border:1px solid black;
                border-radius: 10px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                padding: 20px;
            }
            .first{
                text-align: center;
                background-color: aqua;
                width:auto;
                font-size: large;
                padding:15px;
                margin:-20px -20px 20px -20px;
                 border-radius: 10px 10px 0 0;
            }
            .container p{
                color:lightgray ;
                font-size: small;
            }
            #submit{
                margin:0 auto;
                margin-left: 75px;
                border: 1px;
                border-radius: 10px;
                background-color: aqua;
                font-weight: bold;
            }
            .bua{
                text-align: center;
                position: absolute;
                top:1px;
                right:1px;
                border-radius: 10px;
                background-color: red;
                font-size: large;
                height: fit-content;
                width: 50px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="bua">
                <p>HOT</p>
            </div>
            <h1 class="first">Gói chăm sóc răng</h1>
            <p>Dịch vụ <span style="color: greenyellow;">tẩy trắng răng</span> </p>
            <hr>
            <p>Công nghệ :laser Whitening</p>
            <hr>
            <p>Thời gian:<span style="color: greenyellow;">60 phút</span> </p>
            <hr>
            <p>Bảo hành:<span style="color: greenyellow;">6 tháng</span></p>
            <hr>
            <p>Giá ưu đãi:<span style="color: greenyellow;">1.600.000đ</span></p>
            <input type="submit" id="submit" value="Đặt lịch ngay">
        </div>
    </body>

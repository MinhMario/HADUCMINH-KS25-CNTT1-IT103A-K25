<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <style>
            .container{
                position: relative;
                font-family: Arial, Helvetica, sans-serif;
                width:500px;
            }
            .status{ 
                display: flex;
                 align-items: center;
                 justify-content: center;
                right:10px;
                position: absolute;
                border-radius: 10px;
                background-color: blanchedalmond;
                font-weight: bold;
                color:darkgoldenrod;
                width: 150px;
                height: 40px;
            }
            .bar{
                height:20px;
                width:100%;
                background-color: lightgray;
                border-radius:10px ;
            }
            .barfill{
                height:100%;
                width:60%;
                background-color: chartreuse;
                border-radius: 10px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="status">
            <p>ĐANG ĐIỀU TRỊ</p>
        </div>
        <h2>Niềng chỉnh nha</h2>
        <p>Bác sĩ: BS.Nguyễn Minh Tâm</p>
        <p>Chi phí: 25.000.000đ</p>
        <p>Tiến trình điều trị</p>
        <div class="bar">
            <div class="barfill">
            </div>
        </div>
        <p>Bắt đầu:10/03/2025</p>
        <p>Dự kiến hoàn thành:10/03/2026</p>
    </div>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
            .container {
                position:relative;
                width:300px;
            }
            .container img{
                width: 100%;
                height:100%;
            }
            .btn{
                position: absolute;
                right:5px;
                top: 5px;
            }
            .btn input[type="submit"]{
                border-radius: 10px;
                border-color: white;
                color:white;
                background-color:transparent;
            }
            .profile{
                margin:10px auto;
                display: flex;
                gap:10px;
            }
            .profile img{
                border-radius: 50px;
                width:30px;
            }
            .content p{
                color:lightgray;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="../Session 11/images (1).jpg">
            <div class="btn">
                <input type="submit" value="Basketball">
            </div>
            </div>
            <div class="profile">
                <img src="../Session 11/images (1).jpg">
                <p>Jake Will</p>
            </div>
            <div class="content">
            <p>04 June 2023</p>
            <h2>5 Exercises</h2>
            <p>bheruawfkuwbafueb</p>
            </div>
    </body>

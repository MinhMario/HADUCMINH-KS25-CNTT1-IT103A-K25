<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }

        .news-card {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=800');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            color: white;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
        }

        .tag {
            position: relative;
            width: fit-content;
            border: 2px solid white;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .news-content {
            position: relative;
        }

        .news-date {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .news-description {
            font-size: 16px;
            line-height: 1.5;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .pagination button {
            background-color: #999;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
        }

        .pagination button:hover {
            background-color: #666;
        }

        .pagination button.active {
            background-color: #333;
        }

        .pagination button.arrow {
            background-color: #999;
        }

        .pagination button.arrow:hover {
            background-color: #333;
        }

        .page-number {
            background-color: transparent;
            color: #666;
            padding: 10px 15px;
            cursor: pointer;
        }

        .page-number:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="news-card">
            <div class="tag">Football</div>
            
            <div class="news-content">
                <p class="news-date">Agence France-Presse - 04 June 2023</p>
                <h1 class="news-title">LIONEL MESSI LEAVING LIGUE 1 TEAM PARIS SAINT-GERMAIN, CLUB CONFIRMS</h1>
                <p class="news-description">The EuroLeague Finals Top Scorer is the individual award for the player that gained the highest points in the EuroLeague Finals</p>
            </div>
        </div>

        <div class="pagination">
            <button class="arrow">←</button>
            <button class="active">1</button>
            <button class="page-number">2</button>
            <button class="page-number">3</button>
            <button class="page-number">4</button>
            <button class="arrow">→</button>
        </div>
    </div>
</body>
</html>

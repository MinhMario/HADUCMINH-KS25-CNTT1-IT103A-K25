<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
            .container{
                background-color: rgb(44, 147, 198);
                color:black;
                font-family: Arial, Helvetica, sans-serif;
                max-width:800px;
                padding: 20px;
                border-radius: 10px;
            }
            div:hover{
                background-color:aquamarine;
            }
            .container + .container{
                margin-top: 50px;
            }
            </style>
    </head>
    <body>
        <div class="container">
        <p>SP1</p>
        <p>Giá:100.000đ</p>
        </div>
        
        <div class="container">
            <p>SP2</p>
            <p>Giá :200.000đ</p>
        </div>

        <div class="container">
            <p>SP3</p>

        </div>

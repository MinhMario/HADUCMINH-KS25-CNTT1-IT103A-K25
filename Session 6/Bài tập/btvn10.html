<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
        body{
            display: flex;
            justify-content: center;
        }
        .customer{
            background-color: aliceblue;
        }
        #img{
            border-radius:500px;
        }
        .customer:hover{
            background-color: aquamarine;
        }
        .product{
            display: flex;
            justify-content: center;
        }
    </style>
    <body>
        <div class="customer">
            <img src="../Ảnh/images (3).jpg" id="img">
            <p class="product">"Dịch vụ rất tốt,tôi rất hài lòng"</p>
            <p class="product"><b>Nguyễn Văn A</b></p>
        </div>
        <div class="customer">
            <img src="../Ảnh/images (3).jpg" id="img">
            <p class="product">"Dịch vụ tệ,tôi rất không hài lòng"</p>
            <p class="product"><b>Nguyễn Văn CC</b></p>
        </div>
    </body>
</html>

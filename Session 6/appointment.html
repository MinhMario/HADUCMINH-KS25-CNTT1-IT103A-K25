<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <style>
        
             h1{
                background-color: #a8e6cf;
                color: #006666;
                text-align: center;
            }
            .menu{
                display: flex;
                gap: 20px;
                justify-content: center;
                font-weight: bold;
                background-color: #d4e9f7;
                margin:20px auto;
            }
            .menu a{
                text-decoration: none;
                color: #006666;
            }
            .menu a:hover{
                color:white;
                background-color: aqua;
            }
            .form{
                margin-top: 20px auto;
                display: flex;
                justify-content: center;
                background-color:aliceblue;
                color:#006666;
                font-weight: bold;
                font-size: larger;
            }
            .form div{
                margin:20px auto;
                text-align: center;
            }
            .form input[type="submit"]{
                background-color: aquamarine;
                color:white;
                font-size: larger;
            }
            .footer{
                background-color: #008080;
                color: white;
                text-align: center;
                padding: 20px;
                margin-top: 20px;
            }
            .footer p{
                margin: 5px 0;
            }
        </style>
    </head>
    <body>
         <h1>Danh sách dịch vụ</h1>
          <div class="menu">
            <a href="index.html">Trang chủ</a>
            <a href="services.html">Dịch vụ</a>
            <a href="appointment.html">Đăng ký lịch khám</a>
        </div>
        <div class="form">
            <form>
                <div>
                <label>Họ và tên</label><br>
                <input type="text" name="name" id="name" placeholder="Nhập họ và tên">
                </div>
                <div>
                    <label>Email</label><br>
                    <input type="email" placeholder="example@gmail.com" />
                </div>
                <div>
                    <label>Số điện thoại</label><br>
                    <input type="tel" />
                </div>
                <div>
                    <label>Chọn dịch vụ</label><br>
                    <select>
                        <option>Khám răng tổng quát</option>
                        <option>Lấy cao răng</option>
                        <option>Tẩy trắng răng</option>
                        <option>Niềng răng</option>
                    </select>
                </div>
                <div>
                    <label>Ngày khám</label><br>
                    <input type="date" />
                </div>
                <div>
                    <label>Ghi chú thêm</label><br>
                    <textarea placeholder="Yêu cầu thêm..."></textarea>
                </div>
                <div>
                <input type="submit" value="Gửi đăng ký" />
                </div>
            </form>
        </div>
        <div class="footer">
            <p>© 2026 Nha Khoa Chăm Sóc Nụ Cười Việt</p>
            <p>Địa chỉ: 123 Đường Nụ Cười – Hotline: 0900 000 000</p>
        </div>
    </body>
